services:
  - type: web
    name: multisense-clinical-ai
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn MultiSense.api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PORT
        value: 8000
